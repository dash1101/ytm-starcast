<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YTM Starcast</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true"><canvas id="logo" width="52" height="52"></canvas></span>
    <div class="name">
      <h1>YTM Starcast</h1>
      <span data-tr>YouTube Music companion</span>
    </div>
    <span id="version" hidden></span>
  </header>

  <section class="card" id="state" aria-live="polite">
    <span class="dot idle" id="dot" aria-hidden="true"></span>
    <div class="txt">
      <div id="headline">Checking&hellip;</div>
      <small id="detail" hidden></small>
      <button type="button" id="act" class="tonal" hidden></button>
    </div>
  </section>

  <section class="card" id="upd" hidden>
    <span class="dot ok" aria-hidden="true"></span>
    <div class="txt">
      <div id="updHead"></div>
      <small id="updDetail"></small>
      <button type="button" id="updAct" class="tonal">Update now</button>
    </div>
  </section>

  <section class="card list" id="parts" hidden>
    <div class="sec" data-tr>Parts</div>
    <label class="row">
      <span class="txt"><span data-tr>YouTube Music remote</span><small data-tr>Search, your library and the queue from your phone</small></span>
      <span class="switch"><input type="checkbox" role="switch" data-part="remote" checked disabled><i></i></span>
    </label>
    <label class="row">
      <span class="txt"><span data-tr>Discord status</span><small id="discord">Show what you play on your Discord profile</small></span>
      <span class="switch"><input type="checkbox" role="switch" data-part="discord" checked disabled><i></i></span>
    </label>
    <label class="row">
      <span class="txt">Refine<small data-tr>Improvements inside YouTube Music</small></span>
      <span class="switch"><input type="checkbox" role="switch" data-part="refine" checked disabled><i></i></span>
    </label>
  </section>

  <details class="card" id="dc" hidden>
    <summary data-tr>Discord status options</summary>
    <div id="dcPanel"></div>
  </details>

  <footer>
    <a id="open" class="filled" href="http://127.0.0.1:8777/" target="_blank" rel="noopener" data-tr>Open YTM Starcast</a>
  </footer>
  <script src="i18n_strings.js"></script>
  <script src="i18n.js"></script>
  <script src="logo.js"></script>
  <script src="discord_ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
